
<!DOCTYPE html>
<html>
<head>
  <title>Road Racer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body {
      background: #000;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    h2 { display: none; }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>

<h2>Road Racer</h2>

<canvas id="gameCanvas" width="800" height="1100"></canvas>


<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let car = {
  x: 400,
  y: 350,
  width: 52,
  height: 82,
  speed: 5,
  dx: 0,
  dy: 0
};

let blood = 100;
let tokens = 0;

// Shop items
const shopItems = [
  { id: "color_red",    category: "color", label: "Red",     value: "#cc0000", cost: 0, owned: true },
  { id: "color_blue",   category: "color", label: "Blue",    value: "#1a1aff", cost: 0, owned: true },
  { id: "color_green",  category: "color", label: "Green",   value: "#00aa44", cost: 10, owned: false },
  { id: "color_purple", category: "color", label: "Purple",  value: "#8833cc", cost: 18, owned: false },
  { id: "color_gold",   category: "color", label: "Gold",    value: "#ddaa00", cost: 37, owned: false },
  { id: "color_pink",   category: "color", label: "Pink",    value: "#ff44aa", cost: 12, owned: false },
  { id: "color_black",  category: "color", label: "Stealth", value: "#222222", cost: 50, owned: false },
  { id: "color_orange", category: "color", label: "Orange",  value: "#ff6600", cost: 20, owned: false },
  { id: "glow_none",    category: "glow",  label: "No Glow",  value: "none",     cost: 0, owned: true },
  { id: "glow_blue",    category: "glow",  label: "Blue",     value: "#44aaff",  cost: 3, owned: true },
  { id: "glow_red",     category: "glow",  label: "Red",      value: "#ff4444",  cost: 20, owned: false },
  { id: "glow_green",   category: "glow",  label: "Green",    value: "#44ff44",  cost: 20, owned: false },
  { id: "glow_white",   category: "glow",  label: "White",    value: "#ffffff",  cost: 20, owned: false },
  { id: "glow_rainbow", category: "glow",  label: "Rainbow",  value: "rainbow",  cost: 30, owned: false },
  { id: "speed_normal", category: "speed", label: "Normal",   value: 5,  cost: 0, owned: true },
  { id: "speed_fast",   category: "speed", label: "Fast",     value: 7,  cost: 25, owned: false },
  { id: "speed_turbo",  category: "speed", label: "Turbo",    value: 9,  cost: 60, owned: false },
  { id: "hl_yellow",    category: "headlight", label: "Yellow",  value: "#ffffaa", cost: 0, owned: true },
  { id: "hl_white",     category: "headlight", label: "White",   value: "#ffffff", cost: 0, owned: true },
  { id: "hl_blue",      category: "headlight", label: "Blue",    value: "#66ccff", cost: 9, owned: false },
  { id: "hl_red",       category: "headlight", label: "Red",     value: "#ff4444", cost: 9, owned: false },
  { id: "hl_green",     category: "headlight", label: "Green",   value: "#44ff66", cost: 9, owned: false },
  { id: "hl_purple",    category: "headlight", label: "Purple",  value: "#cc66ff", cost: 15, owned: false },
  { id: "hl_rainbow",   category: "headlight", label: "Rainbow", value: "rainbow", cost: 35, owned: false },
];

let selectedColor = "color_blue";
let selectedGlow = "glow_blue";
let selectedSpeed = "speed_normal";
let selectedHeadlight = "hl_yellow";
let shopScroll = 0; // 0=colors, 1=glow, 2=speed, 3=headlight

function getShopItem(id) { return shopItems.find(i => i.id === id); }
function getSelectedColor() { return getShopItem(selectedColor).value; }
function getSelectedGlow() { return getShopItem(selectedGlow).value; }
function getSelectedSpeed() { return getShopItem(selectedSpeed).value; }
function getSelectedHeadlight() { return getShopItem(selectedHeadlight).value; }
const crashDamage = { person: 2, dog: 1, kangaroo: 3, car: 5, truck: 10, ambulance: 20, police: 15, ufo: 25 };
const allTypes = ["car", "truck", "ambulance", "police", "ufo", "person", "dog", "kangaroo"];
const stats = {};
for (const t of allTypes) stats[t] = { appeared: 0, crashed: 0 };

// Level system
let currentLevel = 0; // 0 = selecting, 1-5 = playing
let showingTitleScreen = true;
let showingLevelSelect = false;
let selectedLevel = 1;
let focusTarget = 0; // 0 = levels, 1 = shop category, 2 = shop items
let shopCursor = "color_blue";
let garageScroll = 0;
let garageCursor = "color_blue";
let confirmBuy = null;
let confirmExit = false;

const levelConfig = [
  null, // placeholder for index 0
  { name: "Rookie",     obstacleSpeed: 0.8, spawnRate: 0.006, pedRate: 0.001, dogRate: 0.001, rooRate: 0.0008, laneChangeRate: 0.001, maxVehicles: 8,  startObstacles: 2, color: "#44ff66" },
  { name: "Driver",     obstacleSpeed: 0.9, spawnRate: 0.01,  pedRate: 0.002, dogRate: 0.002, rooRate: 0.0012, laneChangeRate: 0.003, maxVehicles: 12, startObstacles: 3, color: "#66ccff" },
  { name: "Racer",      obstacleSpeed: 1.2, spawnRate: 0.013, pedRate: 0.003, dogRate: 0.003, rooRate: 0.002,  laneChangeRate: 0.005, maxVehicles: 20, startObstacles: 5, color: "#ffaa00" },
  { name: "Pro",        obstacleSpeed: 1.6, spawnRate: 0.017, pedRate: 0.004, dogRate: 0.004, rooRate: 0.003,  laneChangeRate: 0.008, maxVehicles: 25, startObstacles: 7, color: "#ff6633" },
  { name: "Impossible", obstacleSpeed: 2.2, spawnRate: 0.025, pedRate: 0.006, dogRate: 0.005, rooRate: 0.004,  laneChangeRate: 0.012, maxVehicles: 32, startObstacles: 9, color: "#ff2222" },
];

function getLevelConfig() { return levelConfig[currentLevel] || levelConfig[1]; }

// Device classification — used to tune spawn rates on harder levels.
// minScreenDim < 600 with touch ≈ phone; ≥ 600 with touch ≈ tablet (iPad).
// Non-touch devices fall through to the default 1.0 multiplier.
const _minScreenDim = Math.min(
  (typeof screen !== "undefined" && screen.width)  || 9999,
  (typeof screen !== "undefined" && screen.height) || 9999
);
const _hasTouch = (typeof navigator !== "undefined" && (navigator.maxTouchPoints || 0) > 0)
  || (typeof window !== "undefined" && "ontouchstart" in window);
const isPhone  = _hasTouch && _minScreenDim < 600;
const isTablet = _hasTouch && _minScreenDim >= 600;

function getDeviceSpawnMultiplier(level) {
  if (level < 3) return 1;
  if (isPhone) {
    // Racer / Pro / Impossible — bumped back up after the earlier reductions
    return level === 5 ? 0.78 : level === 4 ? 0.84 : 0.90;
  }
  if (isTablet) {
    // Same levels — boost traffic on tablets where the road is wider
    return level === 5 ? 1.30 : level === 4 ? 1.22 : 1.15;
  }
  return 1;
}

function startLevel(level) {
  currentLevel = level;
  showingLevelSelect = false;
  obstacleBaseSpeed = getLevelConfig().obstacleSpeed;
  blood = 100;
  gameTimer = 3600;
  gameOver = false;
  won = false;
  obstacles.length = 0;
  for (const t of allTypes) { stats[t].appeared = 0; stats[t].crashed = 0; }
  const lc = getLevelConfig();
  for (let i = 0; i < lc.startObstacles; i++) {
    let tries = 0;
    let o;
    do {
      o = randomObstacle(track.y + Math.random() * track.height);
      tries++;
    } while (tries < 20 && obstacles.some(ex => 
      o.x < ex.x + ex.width && o.x + o.width > ex.x &&
      o.y < ex.y + ex.height && o.y + o.height > ex.y
    ));
    stats[o.type].appeared++;
    obstacles.push(o);
  }
  // Scale the player car to match the obstacle scaling for the device.
  car.width = 52 * obstacleScale;
  car.height = 82 * obstacleScale;
  car.x = track.x + (track.width - car.width) / 2;
  car.y = track.y + track.height - car.height - 40;
  car.speed = getSelectedSpeed();
}

// Track boundaries (simple rectangle track) — resizeCanvas() keeps these in sync with the viewport
const track = {
  x: 50,
  y: 50,
  width: 700,
  height: 900
};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  // The road spans the full viewport vertically — HUD overlays on top.
  // Side padding scales with width: small on phones, larger on desktop.
  const sidePad = Math.max(20, Math.min(50, canvas.width * 0.04));
  track.y = 0;
  track.height = canvas.height;
  // Cap road width so a very wide canvas doesn't look like a parking lot.
  const maxRoadW = Math.max(700, track.height * 0.6);
  track.width = Math.min(maxRoadW, Math.max(220, canvas.width - 2 * sidePad));
  track.x = (canvas.width - track.width) / 2;
  // Clamp the car so it stays inside the new track bounds
  if (car.x < track.x) car.x = track.x;
  if (car.y < track.y) car.y = track.y;
  if (car.x + car.width > track.x + track.width) car.x = track.x + track.width - car.width;
  if (car.y + car.height > track.y + track.height) car.y = track.y + track.height - car.height;
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 100));
resizeCanvas();

// ============= DESIGN TRANSFORM =============
// Title/level-select/help screens were laid out for an 800 x 1100 "design"
// canvas. To keep them well-proportioned on any viewport, we letterbox
// (uniform scale + centered) those screens into the actual canvas, and
// expose the active drawing dimensions via renderW/renderH. Gameplay does
// NOT use this transform — the track is sized to the full viewport.
const DESIGN_W = 800;
const DESIGN_H = 1100;
let renderW = canvas.width;
let renderH = canvas.height;

// The level-select has two layouts: a vertical stack of buttons for narrow
// phone-aspect viewports, and a horizontal row of 5 buttons for tablets and
// desktops. Each layout has a different content height, so the design
// transform's content-height for scaling is chosen based on which layout is
// active. isPhoneLayout() is the single source of truth — both draw and
// hit-test consult it.
// Phone layout = short edge < 600px. Catches every iPhone in portrait while
// keeping iPads (≥ 744px short edge) in the horizontal-row layout.
function isPhoneLayout() { return Math.min(canvas.width, canvas.height) < 600; }
// Tablet ≈ iPad-sized: wide enough for a horizontal row, but smaller than a
// full desktop screen. Uses slimmer level buttons than the desktop branch.
function isTabletLayout() { return !isPhoneLayout() && canvas.width <= 1200; }
function getDesignContentH() {
  if (isPhoneLayout()) return 1120;
  if (isTabletLayout()) return 700;
  return 740;
}

function getDesignTransform() {
  const contentH = getDesignContentH();
  const s = Math.min(canvas.width / DESIGN_W, canvas.height / contentH);
  const dw = DESIGN_W * s;
  // Center the visible content band (0..contentH), not the full design canvas,
  // so the top of the layout — "ROAD RACER" included — stays on screen when
  // the viewport is shorter than the full design height.
  const dh = contentH * s;
  return { sx: s, sy: s, ox: (canvas.width - dw) / 2, oy: (canvas.height - dh) / 2 };
}

// Snapshot of the gameplay track, restored by popDesignTransform.
const _designTrack = { x: 50, y: 50, width: 700, height: 600 };
let _savedTrack = null;

function pushDesignTransform() {
  const t = getDesignTransform();
  ctx.save();
  ctx.translate(t.ox, t.oy);
  ctx.scale(t.sx, t.sy);
  renderW = DESIGN_W;
  renderH = DESIGN_H;
  // Swap the track to its design footprint so drawTrack and title-screen
  // decorations line up with the rest of the hard-coded UI layout.
  _savedTrack = { x: track.x, y: track.y, width: track.width, height: track.height };
  Object.assign(track, _designTrack);
}

function popDesignTransform() {
  ctx.restore();
  renderW = canvas.width;
  renderH = canvas.height;
  if (_savedTrack) {
    Object.assign(track, _savedTrack);
    _savedTrack = null;
  }
}

function canvasToDesign(cx, cy) {
  const t = getDesignTransform();
  return { x: (cx - t.ox) / t.sx, y: (cy - t.oy) / t.sy };
}

// Obstacles
let obstacleBaseSpeed = 1;
let spawnCooldown = 0;  // frames remaining before the next vehicle spawn is allowed
const obstacles = [];
const numLanes = 5;

const vehicleTypes = [
  { type: "car", w: 52, h: 82, colors: ["#ff4444", "#44aaff", "#ff8844", "#44cc44", "#ee88cc", "#ffcc00", "#88ccff", "#cc44cc", "#ff6644", "#44ddcc"] },
  { type: "truck", w: 52, h: 115, colors: ["#885500", "#556677", "#994400"] },
  { type: "ambulance", w: 52, h: 82, colors: ["#ffffff"] },
  { type: "police", w: 52, h: 82, colors: ["#111111"] },
  { type: "ufo", w: 65, h: 82, colors: ["#88ccff", "#cc88ff", "#88ffcc"] },
];

function getLaneCenterX(lane, vw) {
  const laneWidth = track.width / numLanes;
  return track.x + lane * laneWidth + (laneWidth - vw) / 2;
}

// Vehicles, pedestrians, dogs, and kangaroos are scaled per device:
// tablets get bigger actors so the wider road feels populated; phones get
// smaller ones so cars fit comfortably in the narrow lanes and the player
// has more room to dodge.
const obstacleScale = isTablet ? 1.3 : isPhone ? 0.78 : 1;

function randomObstacle(yOverride, laneOverride) {
  const vt = vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
  const w = vt.w * obstacleScale;
  const h = vt.h * obstacleScale;
  const lane = laneOverride !== undefined ? laneOverride : Math.floor(Math.random() * numLanes);
  const x = getLaneCenterX(lane, w);
  const y = yOverride !== undefined ? yOverride : track.y - h;
  const color = vt.colors[Math.floor(Math.random() * vt.colors.length)];
  const lc = getLevelConfig();
  const speed = lc.obstacleSpeed + Math.random() * (lc.obstacleSpeed * 1.2);
  return { x, y, width: w, height: h, color, type: vt.type, lane, speed, targetX: x };
}

// Pedestrians (also in obstacles array)
const skinTones = ["#ffcc99", "#f5c5a3", "#c68642", "#8d5524", "#614335"];
const hairColors = ["#553300", "#222222", "#ffcc00", "#cc3300", "#ff8800", "#aaaaaa", "#ee99cc"];
const shirtColors = ["#ff6699", "#66ccff", "#ffcc33", "#99ff66", "#cc99ff", "#ff4444", "#ffffff", "#3366cc"];
const pantsColors = ["#333366", "#444444", "#8B4513", "#2d5a27", "#222222"];
const hatTypes = ["none", "cap", "beanie", "tophat"];
const accessoryTypes = ["none", "glasses", "scarf"];

function randomPedestrian() {
  const w = 24 * obstacleScale;
  const h = 40 * obstacleScale;
  const x = track.x - w;
  const y = track.y + Math.random() * (track.height - h);
  const shirt = shirtColors[Math.floor(Math.random() * shirtColors.length)];
  const skin = skinTones[Math.floor(Math.random() * skinTones.length)];
  const hair = hairColors[Math.floor(Math.random() * hairColors.length)];
  const pants = pantsColors[Math.floor(Math.random() * pantsColors.length)];
  const hat = hatTypes[Math.floor(Math.random() * hatTypes.length)];
  const accessory = accessoryTypes[Math.floor(Math.random() * accessoryTypes.length)];
  const walkSpeed = 0.5 + Math.random() * 1;
  return { x, y, width: w, height: h, color: shirt, skin, hair, pants, hat, accessory, type: "person", speed: 0, walkSpeed, lane: 0, targetX: 0 };
}

// Dogs
const dogColors = ["#8B4513", "#d2a679", "#333333", "#ffffff", "#c4a35a"];

function randomDog() {
  const w = 30 * obstacleScale;
  const h = 24 * obstacleScale;
  const x = track.x - w;
  const y = track.y + Math.random() * (track.height - h);
  const color = dogColors[Math.floor(Math.random() * dogColors.length)];
  const walkSpeed = 0.7 + Math.random() * 1.2;
  return { x, y, width: w, height: h, color, type: "dog", speed: 0, walkSpeed, lane: 0, targetX: 0 };
}

// Kangaroos
const rooColors = ["#8B6914", "#a0784c", "#6b4c2a"];

function randomKangaroo() {
  const w = 28 * obstacleScale;
  const h = 44 * obstacleScale;
  const x = track.x - w;
  const y = track.y + Math.random() * (track.height - h);
  const color = rooColors[Math.floor(Math.random() * rooColors.length)];
  const walkSpeed = 1 + Math.random() * 1.5;
  return { x, y, width: w, height: h, color, type: "kangaroo", speed: 0, walkSpeed, lane: 0, targetX: 0 };
}

// Obstacles spawn when level is selected

// Controls
const keys = {};

document.addEventListener("keydown", e => {
  if (canvas.width > canvas.height) return; // portrait-only
  keys[e.key] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
});


// Pause state
let paused = false;
document.addEventListener("keydown", e => {
  if (canvas.width > canvas.height) return; // portrait-only
  // Help toggle (works everywhere)
  if (e.key === "h" || e.key === "H") { showHelp = !showHelp; return; }

  // Title screen - space to start
  if (showingTitleScreen) {
    if (e.key === " ") {
      showingTitleScreen = false;
      showingLevelSelect = true;
    }
    return;
  }

  // Shop navigation on level select
  if (showingLevelSelect) {
    const cats = ["color", "glow", "speed", "headlight"];
    const selectedId = shopCursor;

    const setSelected = (id) => {
      const item = getShopItem(id);
      shopCursor = id;
      shopScroll = cats.indexOf(item.category);
    };

    if (e.key === "ArrowUp") { focusTarget = (focusTarget + 2) % 3; return; }
    if (e.key === "ArrowDown") { focusTarget = (focusTarget + 1) % 3; if (focusTarget === 2) syncCursorToCategory(); return; }

    const syncCursorToCategory = () => {
      const cat = cats[shopScroll];
      if (cat === "color") shopCursor = selectedColor;
      else if (cat === "glow") shopCursor = selectedGlow;
      else if (cat === "speed") shopCursor = selectedSpeed;
      else shopCursor = selectedHeadlight;
    };

    if (e.key === "ArrowLeft") {
      if (focusTarget === 0) {
        selectedLevel = Math.max(1, selectedLevel - 1);
      } else if (focusTarget === 1) {
        shopScroll = (shopScroll + 3) % 4;
        syncCursorToCategory();
      } else if (focusTarget === 2) {
        const cat = cats[shopScroll];
        const catItems = shopItems.filter(i => i.category === cat);
        const curIdx = catItems.findIndex(i => i.id === shopCursor);
        const prev = catItems[(curIdx - 1 + catItems.length) % catItems.length];
        setSelected(prev.id);
      }
      return;
    }
    if (e.key === "ArrowRight") {
      if (focusTarget === 0) {
        selectedLevel = Math.min(5, selectedLevel + 1);
      } else if (focusTarget === 1) {
        shopScroll = (shopScroll + 1) % 4;
        syncCursorToCategory();
      } else if (focusTarget === 2) {
        const cat = cats[shopScroll];
        const catItems = shopItems.filter(i => i.category === cat);
        const curIdx = catItems.findIndex(i => i.id === shopCursor);
        const next = catItems[(curIdx + 1) % catItems.length];
        setSelected(next.id);
      }
      return;
    }
    // Handle confirm buy dialog
    if (confirmBuy) {
      if (e.key === "y" || e.key === "Y") {
        tokens -= confirmBuy.cost;
        getShopItem(confirmBuy.id).owned = true;
        shopCursor = confirmBuy.id;
        confirmBuy = null;
        return;
      }
      if (e.key === "n" || e.key === "N") {
        confirmBuy = null;
        return;
      }
      return;
    }

    if (e.key === "b" || e.key === "B") {
      const sel = getShopItem(selectedId);
      if (sel && !sel.owned && tokens >= sel.cost) {
        confirmBuy = { id: sel.id, label: sel.label, cost: sel.cost };
      }
      return;
    }
    if (e.key === "Enter") { startLevel(selectedLevel); return; }
    if (e.key >= "1" && e.key <= "5") { startLevel(parseInt(e.key)); return; }
  }
  // While the return-to-menu prompt is up, only Y/N/Esc respond.
  if (confirmExit) {
    if (e.key === "y" || e.key === "Y") {
      confirmExit = false;
      showingTitleScreen = true;
      won = false; gameOver = false; resetting = false; paused = false;
      obstacles.length = 0;
      explosionParticles.length = 0;
      damagePopups.length = 0;
      crashMessage = null;
    } else if (e.key === "n" || e.key === "N" || e.key === "Escape") {
      confirmExit = false;
    }
    return;
  }
  if (e.key === "p" || e.key === "P") paused = true;
  if (e.key === "t" || e.key === "T") paused = false;
  if (e.key === "Escape") {
    confirmExit = true;
    return;
  }
  if ((e.key === "r" || e.key === "R") && !resetting) {
    resetting = true;
    resetTimer = 120; // 2 seconds
  }
  if ((e.key === "u" || e.key === "U") && won) {
    won = false;
    showingLevelSelect = true;
    obstacles.length = 0;
    explosionParticles.length = 0;
    damagePopups.length = 0;
    crashMessage = null;
  }
});

// ============= TOUCH / POINTER INPUT (for iPad / iPhone) =============
//
// Drive model: "point-to-go". While a finger is on the playfield, the car
// drives toward the touch point at its current speed. Release the finger
// and the car stops. UI screens (title/level select/shop/garage, modal
// confirms, pause, win) are tap-driven via hit-testing the same geometry
// used by the draw functions.

let driveTarget = null;     // { x, y } in canvas coords while a touch drives
let driveTouchId = null;    // identifier of the active drive touch
let mouseDriving = false;   // mouse fallback for desktop

function clientToCanvas(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * canvas.width / rect.width,
    y: (clientY - rect.top) * canvas.height / rect.height,
  };
}

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

// In-game HUD buttons (pause/play toggle, reset, menu) — shown only while
// playing. Keep these synced with drawInGameButtons() below.
function getInGameButtons() {
  const size = 36, gap = 10;
  const total = 3 * size + 2 * gap;
  const x0 = (canvas.width - total) / 2;
  const y = 6;
  return {
    toggle: { x: x0, y, w: size, h: size },
    reset:  { x: x0 + (size + gap), y, w: size, h: size },
    menu:   { x: x0 + 2 * (size + gap), y, w: size, h: size },
  };
}

function inGameButtonHit(px, py) {
  const b = getInGameButtons();
  if (pointInRect(px, py, b.toggle)) return "toggle";
  if (pointInRect(px, py, b.reset)) return "reset";
  if (pointInRect(px, py, b.menu)) return "menu";
  return null;
}

// Layout for the "Return to menu?" confirmation overlay. Coordinates are in
// viewport pixels (the dialog is drawn outside the design transform).
function confirmExitLayout() {
  const mw = Math.min(360, canvas.width * 0.85);
  const mh = 170;
  const mx = (canvas.width - mw) / 2;
  const my = (canvas.height - mh) / 2;
  const by = my + 115;
  const bw = 100, bh = 36;
  return {
    box: { x: mx, y: my, w: mw, h: mh },
    yes: { x: mx + mw / 2 - bw - 12, y: by, w: bw, h: bh },
    no:  { x: mx + mw / 2 + 12,      y: by, w: bw, h: bh },
  };
}

function confirmExitHit(px, py) {
  const l = confirmExitLayout();
  if (pointInRect(px, py, l.yes)) return "yes";
  if (pointInRect(px, py, l.no)) return "no";
  return null;
}

// Hit-test the level-select / shop / garage layout. Geometry mirrors
// drawLevelSelect() so any change there must update here too. Coordinates
// are in DESIGN space — call canvasToDesign() first to convert taps.
function levelSelectHit(px, py) {
  const W = DESIGN_W;
  // Level buttons — vertical stack on phone-aspect viewports, horizontal row
  // (the original layout) on tablet/desktop.
  let shopY;
  if (isPhoneLayout()) {
    const btnW = 400, btnH = 138, btnGap = 12;
    const btnX = (W - btnW) / 2;
    const btnY = 130;
    for (let i = 1; i <= 5; i++) {
      const by = btnY + (i - 1) * (btnH + btnGap);
      if (pointInRect(px, py, { x: btnX, y: by, w: btnW, h: btnH })) return { kind: "level", value: i };
    }
    shopY = btnY + 5 * btnH + 4 * btnGap + 28;
  } else {
    // iPad/tablet uses slimmer buttons; desktop keeps the full 170x240.
    const tablet = isTabletLayout();
    const btnW = tablet ? 140 : 170;
    const btnH = tablet ? 195 : 240;
    const gap = tablet ? 12 : 4;
    const startX = (W - (5 * btnW + 4 * gap)) / 2;
    const btnY = 185;
    for (let i = 1; i <= 5; i++) {
      const bx = startX + (i - 1) * (btnW + gap);
      if (pointInRect(px, py, { x: bx, y: btnY, w: btnW, h: btnH })) return { kind: "level", value: i };
    }
    shopY = btnY + btnH + 30;
  }
  // Shop section — bigger panel + larger item tiles, grid of up to 4 per row
  const shopH = 260;
  const tabW = 130;
  const tabStartX = W / 2 - (4 * tabW + 30) / 2;
  for (let i = 0; i < 4; i++) {
    const tx = tabStartX + i * (tabW + 10);
    if (pointInRect(px, py, { x: tx, y: shopY + 30, w: tabW, h: 28 })) return { kind: "shopTab", value: i };
  }
  const categories = ["color", "glow", "speed", "headlight"];
  const catItems = shopItems.filter(it => it.category === categories[shopScroll]);
  const itemW = 104, itemH = 86, itemGap = 10, itemRowGap = 10;
  const itemsPerRow = 4;
  const itemY = shopY + 72;
  for (let i = 0; i < catItems.length; i++) {
    const row = Math.floor(i / itemsPerRow);
    const col = i % itemsPerRow;
    const colsThisRow = Math.min(itemsPerRow, catItems.length - row * itemsPerRow);
    const rowTotalW = colsThisRow * itemW + (colsThisRow - 1) * itemGap;
    const rowStartX = W / 2 - rowTotalW / 2;
    const ix = rowStartX + col * (itemW + itemGap);
    const iy = itemY + row * (itemH + itemRowGap);
    if (pointInRect(px, py, { x: ix, y: iy, w: itemW, h: itemH })) return { kind: "shopItem", id: catItems[i].id };
  }
  // "How to Play" tappable region — matches the bold hint at hintBaseY + 32
  const helpCenterY = shopY + shopH + 28 + 32;
  if (pointInRect(px, py, { x: W / 2 - 160, y: helpCenterY - 22, w: 320, h: 40 })) return { kind: "help" };
  return null;
}

function confirmBuyHit(px, py) {
  const W = DESIGN_W, H = DESIGN_H;
  const mw = 360, mh = 150;
  const mx = (W - mw) / 2, my = (H - mh) / 2;
  const by = my + 95;
  if (pointInRect(px, py, { x: mx + 60, y: by, w: 90, h: 32 })) return "yes";
  if (pointInRect(px, py, { x: mx + 210, y: by, w: 90, h: 32 })) return "no";
  // Tap outside the buttons but inside the modal still swallows the tap
  if (pointInRect(px, py, { x: mx, y: my, w: mw, h: mh })) return "modal";
  return null;
}

function equipItem(item) {
  if (item.category === "color") selectedColor = item.id;
  else if (item.category === "glow") selectedGlow = item.id;
  else if (item.category === "speed") selectedSpeed = item.id;
  else selectedHeadlight = item.id;
}

// Returns true if the tap was consumed (no further driving behavior).
function handleTap(px, py) {
  // Portrait-only — swallow taps while the rotate prompt is up.
  if (canvas.width > canvas.height) return true;
  // Return-to-menu confirmation takes precedence over everything else in-game.
  if (confirmExit) {
    const hit = confirmExitHit(px, py);
    if (hit === "yes") {
      confirmExit = false;
      showingTitleScreen = true;
      won = false; gameOver = false; resetting = false; paused = false;
      obstacles.length = 0;
      explosionParticles.length = 0;
      damagePopups.length = 0;
      crashMessage = null;
    } else if (hit === "no") {
      confirmExit = false;
    }
    return true;
  }
  if (showHelp) {
    showHelp = false;
    return true;
  }
  if (showingTitleScreen) {
    showingTitleScreen = false;
    showingLevelSelect = true;
    return true;
  }
  if (showingLevelSelect) {
    // Level-select is drawn inside the design transform, so convert canvas
    // coordinates back into design space before hit-testing.
    const d = canvasToDesign(px, py);
    if (confirmBuy) {
      const r = confirmBuyHit(d.x, d.y);
      if (r === "yes") {
        tokens -= confirmBuy.cost;
        getShopItem(confirmBuy.id).owned = true;
        shopCursor = confirmBuy.id;
        confirmBuy = null;
      } else if (r === "no") {
        confirmBuy = null;
      } else if (r === null) {
        // Tap outside modal cancels
        confirmBuy = null;
      }
      return true;
    }
    const hit = levelSelectHit(d.x, d.y);
    if (!hit) return true; // swallow stray taps on this screen
    const categories = ["color", "glow", "speed", "headlight"];
    if (hit.kind === "level") {
      // First tap selects, second tap on the already-selected level starts it
      if (selectedLevel === hit.value && focusTarget === 0) {
        startLevel(hit.value);
      } else {
        selectedLevel = hit.value;
        focusTarget = 0;
      }
      return true;
    }
    if (hit.kind === "shopTab") {
      shopScroll = hit.value;
      focusTarget = 1;
      const cat = categories[shopScroll];
      shopCursor = cat === "color" ? selectedColor : cat === "glow" ? selectedGlow : cat === "speed" ? selectedSpeed : selectedHeadlight;
      return true;
    }
    if (hit.kind === "shopItem") {
      const item = getShopItem(hit.id);
      shopCursor = item.id;
      shopScroll = categories.indexOf(item.category);
      focusTarget = 2;
      if (item.owned) {
        equipItem(item);
      } else if (tokens >= item.cost) {
        confirmBuy = { id: item.id, label: item.label, cost: item.cost };
      }
      return true;
    }
    if (hit.kind === "help") {
      showHelp = true;
      return true;
    }
    return true;
  }
  // In game (or modal overlays)
  if (won) {
    won = false;
    showingLevelSelect = true;
    obstacles.length = 0;
    explosionParticles.length = 0;
    damagePopups.length = 0;
    crashMessage = null;
    return true;
  }
  if (gameOver || resetting) return true;
  const hudHit = inGameButtonHit(px, py);
  if (hudHit === "toggle") { paused = !paused; return true; }
  if (hudHit === "reset") {
    if (!resetting) { resetting = true; resetTimer = 120; }
    return true;
  }
  if (hudHit === "menu") {
    confirmExit = true;
    return true;
  }
  if (paused) {
    paused = false;
    return true;
  }
  // Not consumed -> caller may treat this as the start of a drive gesture
  return false;
}

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const { x, y } = clientToCanvas(t.clientX, t.clientY);
    const consumed = handleTap(x, y);
    if (!consumed && driveTouchId === null) {
      driveTouchId = t.identifier;
      driveTarget = { x, y };
    }
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === driveTouchId) {
      const { x, y } = clientToCanvas(t.clientX, t.clientY);
      driveTarget = { x, y };
    }
  }
}, { passive: false });

function endDriveTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === driveTouchId) {
      driveTouchId = null;
      driveTarget = null;
    }
  }
}
canvas.addEventListener("touchend", e => { e.preventDefault(); endDriveTouch(e); }, { passive: false });
canvas.addEventListener("touchcancel", endDriveTouch);

// Mouse fallback so the same UI works on desktop with a mouse / trackpad
canvas.addEventListener("mousedown", e => {
  const { x, y } = clientToCanvas(e.clientX, e.clientY);
  const consumed = handleTap(x, y);
  if (!consumed) {
    mouseDriving = true;
    driveTarget = { x, y };
  }
});
canvas.addEventListener("mousemove", e => {
  if (!mouseDriving) return;
  const { x, y } = clientToCanvas(e.clientX, e.clientY);
  driveTarget = { x, y };
});
function endMouseDrive() {
  mouseDriving = false;
  driveTarget = null;
}
canvas.addEventListener("mouseup", endMouseDrive);
canvas.addEventListener("mouseleave", endMouseDrive);

// Prevent the page from scrolling when finger drags on the body
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

let showHelp = false;

// Crash state
let crashFrozen = false;
let crashMessage = null;
let gameOver = false;
let gameOverTimer = 0;
let resetting = false;
let resetTimer = 0;
let gameTimer = 3600; // 60 seconds at 60fps
let won = false;
let wonTimer = 0;

// Damage pop-ups
let damagePopups = [];

// Explosion particles
let explosionParticles = [];

function spawnExplosion(x, y) {
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    const size = 3 + Math.random() * 6;
    const colors = ["#ff4400", "#ffaa00", "#ffee00", "#ff6600", "#ffffff", "#ff0000"];
    explosionParticles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 40 + Math.random() * 30,
    });
  }
}

function updateExplosion() {
  for (let i = explosionParticles.length - 1; i >= 0; i--) {
    const p = explosionParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.size *= 0.97;
    p.life--;
    if (p.life <= 0) explosionParticles.splice(i, 1);
  }
}

function drawExplosion() {
  for (const p of explosionParticles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function triggerCrash(obs) {
  const msg = obs.type === "police" ? "bro got arrested" : obs.type === "ambulance" ? "someone died" : obs.type === "dog" ? "woof woof!" : obs.type === "kangaroo" ? "car got destroyed" : obs.type === "ufo" ? "aliens invaded!" : "what the hell was that for!";
  const cx = obs.x + obs.width / 2;
  const cy = obs.y + obs.height / 2;
  crashMessage = { x: obs.x, y: obs.y, text: msg };
  spawnExplosion(cx, cy);
  if (stats[obs.type]) stats[obs.type].crashed++;
  const dmg = crashDamage[obs.type] || 5;
  blood = Math.max(0, blood - dmg);
  damagePopups.push({ x: cx, y: cy, text: "-" + dmg, life: 60 });
  if (blood <= 0 && !gameOver && !won && !resetting) {
    gameOver = true;
    gameOverTimer = 180; // 3 seconds at 60fps
  }
  // Remove the obstacle
  const idx = obstacles.indexOf(obs);
  if (idx !== -1) obstacles.splice(idx, 1);
  setTimeout(() => { crashMessage = null; }, 2000);
}

// Update movement
function update() {
  if (confirmExit) return; // freeze the game while the return-to-menu prompt is up
  car.dx = 0;
  car.dy = 0;

  if (keys["ArrowUp"]) car.dy = -car.speed;
  if (keys["ArrowDown"]) car.dy = car.speed;
  if (keys["ArrowLeft"]) car.dx = -car.speed;
  if (keys["ArrowRight"]) car.dx = car.speed;

  // Touch / mouse drive — head toward the active touch point at full speed
  if (driveTarget) {
    const cx = car.x + car.width / 2;
    const cy = car.y + car.height / 2;
    const dx = driveTarget.x - cx;
    const dy = driveTarget.y - cy;
    const dist = Math.hypot(dx, dy);
    // Dead zone: don't jitter when the finger is on top of the car
    if (dist > 4) {
      const step = Math.min(dist, car.speed);
      car.dx = (dx / dist) * step;
      car.dy = (dy / dist) * step;
    }
  }

  car.x += car.dx;
  car.y += car.dy;

  // Keep inside track
  if (car.x < track.x) car.x = track.x;
  if (car.y < track.y) car.y = track.y;
  if (car.x + car.width > track.x + track.width)
    car.x = track.x + track.width - car.width;
  if (car.y + car.height > track.y + track.height)
    car.y = track.y + track.height - car.height;

  // Move obstacles
  for (const obs of obstacles) {
    if (obs.type === "person" || obs.type === "dog" || obs.type === "kangaroo") {
      // Walk left to right
      obs.x += obs.walkSpeed;
    } else {
      obs.y += obs.speed;

      // Randomly change lane
      if (Math.random() < getLevelConfig().laneChangeRate) {
        const newLane = Math.max(0, Math.min(numLanes - 1, obs.lane + (Math.random() < 0.5 ? -1 : 1)));
        obs.lane = newLane;
        obs.targetX = getLaneCenterX(newLane, obs.width);
      }

      // Smoothly move to target lane
      if (Math.abs(obs.x - obs.targetX) > 1) {
        obs.x += (obs.targetX - obs.x) * 0.05;
      } else {
        obs.x = obs.targetX;
      }
    }
  }

  // Keep vehicles in same lane from stacking on each other
  const vehTypes = ["car","truck","ambulance","police","ufo"];
  const vehs = obstacles.filter(o => vehTypes.includes(o.type));
  for (let i = 0; i < vehs.length; i++) {
    for (let j = i + 1; j < vehs.length; j++) {
      const a = vehs[i];
      const b = vehs[j];
      // Same lane?
      if (Math.abs(a.x - b.x) > 20) continue;
      // Overlapping vertically?
      const gap = 15; // min pixels between them
      const aTop = a.y, aBot = a.y + a.height;
      const bTop = b.y, bBot = b.y + b.height;
      if (aBot + gap > bTop && aTop - gap < bBot) {
        // Push apart
        if (a.y < b.y) {
          const push = ((aBot + gap) - bTop) * 0.5 + 1;
          a.y = Math.max(track.y, a.y - push);
          b.y = Math.min(track.y + track.height - b.height, b.y + push);
        } else {
          const push = ((bBot + gap) - aTop) * 0.5 + 1;
          a.y = Math.min(track.y + track.height - a.height, a.y + push);
          b.y = Math.max(track.y, b.y - push);
        }
      }
    }
  }

  // Push overlapping obstacles apart (prevent any two things overlapping)
  for (let i = 0; i < obstacles.length; i++) {
    for (let j = i + 1; j < obstacles.length; j++) {
      const a = obstacles[i];
      const b = obstacles[j];
      const overlapX = Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x);
      const overlapY = Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y);
      if (overlapX > 0 && overlapY > 0) {
        // Push apart - use whichever axis has less overlap (natural separation)
        if (overlapX < overlapY) {
          const push = overlapX * 0.5 + 1;
          if (a.x < b.x) { a.x -= push; b.x += push; }
          else { a.x += push; b.x -= push; }
        } else {
          const push = overlapY * 0.5 + 1;
          if (a.y < b.y) { a.y -= push; b.y += push; }
          else { a.y += push; b.y -= push; }
        }
      }
    }
  }

  // Check vehicle-dog collisions
  const vehicleTypes2 = ["car", "truck", "police", "ambulance", "ufo"];
  for (const veh of obstacles) {
    if (!vehicleTypes2.includes(veh.type)) continue;
    for (const dog of obstacles) {
      if ((dog.type !== "dog" && dog.type !== "kangaroo" && dog.type !== "person") || dog.hit) continue;
      if (
        veh.x < dog.x + dog.width &&
        veh.x + veh.width > dog.x &&
        veh.y < dog.y + dog.height &&
        veh.y + veh.height > dog.y
      ) {
        dog.hit = true;
        dog.color = "red";
        dog.walkSpeed = 0;
        setTimeout(() => {
          const idx = obstacles.indexOf(dog);
          if (idx !== -1) obstacles.splice(idx, 1);
        }, 3000);
      }
    }
  }

  // Remove obstacles that go past the bottom/right of the track
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    if ((obs.type === "person" || obs.type === "dog" || obs.type === "kangaroo") && obs.x > track.x + track.width) {
      obstacles.splice(i, 1);
    } else if (obs.type !== "person" && obs.type !== "dog" && obs.type !== "kangaroo" && obs.y > track.y + track.height) {
      obstacles.splice(i, 1);
    }
  }

  // Spawn new vehicle obstacles from the top.
  //  - A cooldown counter (with jittered reset) staggers spawn timing so cars
  //    don't appear bunched up frame-after-frame.
  //  - Before spawning, we count which lanes are already occupied in the
  //    top spawn band; if 4 or more lanes are full we skip the spawn entirely
  //    so the player always has at least one open lane to drive through
  //    (i.e., never 5 cars across the same row).
  const lc = getLevelConfig();
  const effectiveSpawnRate = lc.spawnRate * getDeviceSpawnMultiplier(currentLevel);
  const vehicleCount = obstacles.filter(o => ["car", "truck", "police", "ambulance", "ufo"].includes(o.type)).length;
  if (spawnCooldown > 0) spawnCooldown--;
  if (spawnCooldown <= 0 && vehicleCount < lc.maxVehicles && Math.random() < effectiveSpawnRate) {
    // Which lanes already have a vehicle near the top of the road?
    const vehTypes = ["car", "truck", "police", "ambulance", "ufo"];
    const bandTop = track.y;
    const bandBot = track.y + 180; // ~2 car lengths
    const occupiedLanes = new Set();
    for (const ex of obstacles) {
      if (!vehTypes.includes(ex.type)) continue;
      if (ex.y < bandBot && ex.y + ex.height > bandTop) occupiedLanes.add(ex.lane);
    }
    // If 4+ lanes are occupied at the top, adding one more would close the
    // road; skip this spawn and wait until traffic clears.
    if (occupiedLanes.size < 4) {
      const freeLanes = [];
      for (let l = 0; l < numLanes; l++) if (!occupiedLanes.has(l)) freeLanes.push(l);
      // Prefer a free lane (no overlap risk); fall back to fully random if
      // somehow none qualified (shouldn't happen with the guard above).
      const chosenLane = freeLanes.length > 0
        ? freeLanes[Math.floor(Math.random() * freeLanes.length)]
        : Math.floor(Math.random() * numLanes);
      let tries = 0;
      let o;
      do {
        o = randomObstacle(undefined, chosenLane);
        tries++;
      } while (tries < 6 && obstacles.some(ex =>
        o.x < ex.x + ex.width && o.x + o.width > ex.x &&
        o.y < ex.y + ex.height && o.y + o.height > ex.y
      ));
      stats[o.type].appeared++;
      obstacles.push(o);
      // Stagger the next spawn — jittered cooldown so timing isn't uniform.
      // Higher levels = shorter min gap so traffic still feels intense.
      const baseGap = Math.max(10, 38 - currentLevel * 5);
      spawnCooldown = baseGap + Math.floor(Math.random() * baseGap);
    }
  }

  // Spawn pedestrians from the left
  if (Math.random() < lc.pedRate) {
    let tries = 0;
    let o;
    do {
      o = randomPedestrian();
      tries++;
    } while (tries < 10 && obstacles.some(ex => 
      o.x < ex.x + ex.width && o.x + o.width > ex.x &&
      o.y < ex.y + ex.height && o.y + o.height > ex.y
    ));
    stats.person.appeared++;
    obstacles.push(o);
  }

  // Spawn dogs from the left
  if (Math.random() < lc.dogRate) {
    let tries = 0;
    let o;
    do {
      o = randomDog();
      tries++;
    } while (tries < 10 && obstacles.some(ex => 
      o.x < ex.x + ex.width && o.x + o.width > ex.x &&
      o.y < ex.y + ex.height && o.y + o.height > ex.y
    ));
    stats.dog.appeared++;
    obstacles.push(o);
  }

  // Spawn kangaroos from the left
  if (Math.random() < lc.rooRate) {
    let tries = 0;
    let o;
    do {
      o = randomKangaroo();
      tries++;
    } while (tries < 10 && obstacles.some(ex => 
      o.x < ex.x + ex.width && o.x + o.width > ex.x &&
      o.y < ex.y + ex.height && o.y + o.height > ex.y
    ));
    stats.kangaroo.appeared++;
    obstacles.push(o);
  }

  // Block car from moving into obstacles + damage
  for (const obs of obstacles) {
    if (
      car.x < obs.x + obs.width &&
      car.x + car.width > obs.x &&
      car.y < obs.y + obs.height &&
      car.y + car.height > obs.y
    ) {
      triggerCrash(obs);
      // Push car back so it doesn't sit inside
      if (car.dy < 0) car.y = obs.y + obs.height;
      else if (car.dy > 0) car.y = obs.y - car.height;
      if (car.dx < 0) car.x = obs.x + obs.width;
      else if (car.dx > 0) car.x = obs.x - car.width;
      break;
    }
  }
}

// Lane lines animation offset
let laneOffset = 0;

// Draw track
function drawTrack() {
  // Grass shoulders
  const shoulderW = 18;
  ctx.fillStyle = "#2d5a1e";
  ctx.fillRect(track.x - shoulderW, track.y, shoulderW, track.height);
  ctx.fillRect(track.x + track.width, track.y, shoulderW, track.height);

  // Grass texture dots
  ctx.fillStyle = "#3a7a28";
  for (let gy = track.y; gy < track.y + track.height; gy += 12) {
    for (let gx = 0; gx < shoulderW; gx += 8) {
      ctx.fillRect(track.x - shoulderW + gx + (gy % 16 ? 3 : 0), gy, 2, 2);
      ctx.fillRect(track.x + track.width + gx + (gy % 16 ? 3 : 0), gy, 2, 2);
    }
  }

  // Road surface with subtle gradient
  const roadGrad = ctx.createLinearGradient(track.x, 0, track.x + track.width, 0);
  roadGrad.addColorStop(0, "#2a2a2a");
  roadGrad.addColorStop(0.15, "#383838");
  roadGrad.addColorStop(0.5, "#3e3e3e");
  roadGrad.addColorStop(0.85, "#383838");
  roadGrad.addColorStop(1, "#2a2a2a");
  ctx.fillStyle = roadGrad;
  ctx.fillRect(track.x, track.y, track.width, track.height);

  // Red/white curb on edges (scrolling)
  ctx.save();
  ctx.beginPath();
  ctx.rect(track.x - 4, track.y, 4, track.height);
  ctx.rect(track.x + track.width, track.y, 4, track.height);
  ctx.clip();
  const curbSize = 10;
  for (let cy = -curbSize + (laneOffset * 2) % (curbSize * 2); cy < track.height + curbSize; cy += curbSize) {
    const idx = Math.floor((cy + curbSize * 100) / curbSize) % 2;
    ctx.fillStyle = idx ? "#cc0000" : "#ffffff";
    ctx.fillRect(track.x - 4, track.y + cy, 4, curbSize);
    ctx.fillRect(track.x + track.width, track.y + cy, 4, curbSize);
  }
  ctx.restore();

  // Solid white edge lines
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.fillRect(track.x, track.y, 2, track.height);
  ctx.fillRect(track.x + track.width - 2, track.y, 2, track.height);

  // Dashed lane lines (scrolling down)
  const laneWidth = track.width / numLanes;
  const dashHeight = 30;
  const gapHeight = 20;

  ctx.save();
  ctx.beginPath();
  ctx.rect(track.x, track.y, track.width, track.height);
  ctx.clip();

  for (let i = 1; i < numLanes; i++) {
    const lx = track.x + i * laneWidth;
    ctx.fillStyle = "rgba(255,255,200,0.5)";
    ctx.shadowColor = "rgba(255,255,100,0.3)";
    ctx.shadowBlur = 4;
    for (let dy = -dashHeight + laneOffset; dy < track.height; dy += dashHeight + gapHeight) {
      ctx.fillRect(lx - 1.5, track.y + dy, 3, dashHeight);
    }
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  // Animate lane scroll
  if (!paused) {
    laneOffset = (laneOffset + getLevelConfig().obstacleSpeed) % (dashHeight + gapHeight);
  }
}

// Shared: headlight glow in front — all dimensions scale with the car size.
function drawHeadlightGlow(obs) {
  const cx = obs.x + obs.width / 2;
  const offY = obs.height * 0.12;
  const r0 = obs.width * 0.04;
  const r1 = Math.max(obs.width, obs.height) * 0.5;
  const padX = obs.width * 0.2;
  const fillH = obs.height * 0.6;
  const gradient = ctx.createRadialGradient(cx, obs.y + obs.height + offY, r0, cx, obs.y + obs.height + offY, r1);
  gradient.addColorStop(0, "rgba(255,255,255,0.4)");
  gradient.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gradient;
  ctx.fillRect(obs.x - padX, obs.y + obs.height, obs.width + padX * 2, fillH);
}

// Shared: wheels
function drawWheels(obs) {
  const w = obs.width, h = obs.height;
  ctx.fillStyle = "#333";
  ctx.fillRect(obs.x - 4, obs.y + 6, 5, 12);
  ctx.fillRect(obs.x + w - 1, obs.y + 6, 5, 12);
  ctx.fillRect(obs.x - 4, obs.y + h - 18, 5, 12);
  ctx.fillRect(obs.x + w - 1, obs.y + h - 18, 5, 12);
}

// --- CAR ---
function drawCarObstacle(obs) {
  const cx = obs.x + obs.width / 2;
  const w = obs.width, h = obs.height;

  drawHeadlightGlow(obs);
  drawWheels(obs);

  // Body
  ctx.fillStyle = obs.color;
  ctx.beginPath();
  ctx.moveTo(obs.x + 3, obs.y);
  ctx.lineTo(obs.x, obs.y + h * 0.7);
  ctx.quadraticCurveTo(cx, obs.y + h + 4, obs.x + w, obs.y + h * 0.7);
  ctx.lineTo(obs.x + w - 3, obs.y);
  ctx.closePath();
  ctx.fill();

  // Windshield
  ctx.fillStyle = "#88ccff";
  ctx.beginPath();
  ctx.moveTo(obs.x + 5, obs.y + h * 0.65);
  ctx.quadraticCurveTo(cx, obs.y + h * 0.85, obs.x + w - 5, obs.y + h * 0.65);
  ctx.lineTo(obs.x + w - 6, obs.y + h * 0.5);
  ctx.lineTo(obs.x + 6, obs.y + h * 0.5);
  ctx.closePath();
  ctx.fill();

  // Rear window
  ctx.fillStyle = "#6699cc";
  ctx.fillRect(obs.x + 6, obs.y + h * 0.18, w - 12, h * 0.12);

  // Headlights
  const hlR = w * 0.1;
  ctx.fillStyle = "yellow";
  ctx.beginPath(); ctx.arc(obs.x + hlR, obs.y + h * 0.75, hlR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(obs.x + w - hlR, obs.y + h * 0.75, hlR, 0, Math.PI * 2); ctx.fill();

  // Taillights
  ctx.fillStyle = "red";
  ctx.beginPath(); ctx.arc(obs.x + hlR, obs.y + hlR * 0.8, hlR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(obs.x + w - hlR, obs.y + hlR * 0.8, hlR, 0, Math.PI * 2); ctx.fill();
}

// --- TRUCK ---
function drawTruckObstacle(obs) {
  const cx = obs.x + obs.width / 2;
  const w = obs.width, h = obs.height;

  drawHeadlightGlow(obs);

  // Extra rear wheels
  ctx.fillStyle = "#333";
  ctx.fillRect(obs.x - 4, obs.y + 6, 5, 12);
  ctx.fillRect(obs.x + w - 1, obs.y + 6, 5, 12);
  ctx.fillRect(obs.x - 4, obs.y + 22, 5, 12);
  ctx.fillRect(obs.x + w - 1, obs.y + 22, 5, 12);
  ctx.fillRect(obs.x - 4, obs.y + h - 18, 5, 12);
  ctx.fillRect(obs.x + w - 1, obs.y + h - 18, 5, 12);

  // Cargo box (top part)
  ctx.fillStyle = obs.color;
  ctx.fillRect(obs.x, obs.y, w, h * 0.6);
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 1;
  ctx.strokeRect(obs.x, obs.y, w, h * 0.6);

  // Cabin (bottom, facing down)
  ctx.fillStyle = "#666";
  ctx.beginPath();
  ctx.moveTo(obs.x, obs.y + h * 0.6);
  ctx.lineTo(obs.x, obs.y + h * 0.85);
  ctx.quadraticCurveTo(cx, obs.y + h + 4, obs.x + w, obs.y + h * 0.85);
  ctx.lineTo(obs.x + w, obs.y + h * 0.6);
  ctx.closePath();
  ctx.fill();

  // Cabin windshield
  ctx.fillStyle = "#88ccff";
  ctx.fillRect(obs.x + 4, obs.y + h * 0.65, w - 8, h * 0.12);

  // Headlights
  const hlR = w * 0.1;
  ctx.fillStyle = "yellow";
  ctx.beginPath(); ctx.arc(obs.x + hlR, obs.y + h * 0.85, hlR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(obs.x + w - hlR, obs.y + h * 0.85, hlR, 0, Math.PI * 2); ctx.fill();

  // Taillights
  ctx.fillStyle = "red";
  ctx.fillRect(obs.x + 1, obs.y, 8, 6);
  ctx.fillRect(obs.x + w - 9, obs.y, 8, 6);
}

// --- AMBULANCE ---
function drawAmbulanceObstacle(obs) {
  const cx = obs.x + obs.width / 2;
  const w = obs.width, h = obs.height;

  drawHeadlightGlow(obs);

  // White body
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.moveTo(obs.x + 2, obs.y);
  ctx.lineTo(obs.x, obs.y + h * 0.75);
  ctx.quadraticCurveTo(cx, obs.y + h + 3, obs.x + w, obs.y + h * 0.75);
  ctx.lineTo(obs.x + w - 2, obs.y);
  ctx.closePath();
  ctx.fill();

  // Red cross on top
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(cx - 2, obs.y + h * 0.1, 4, h * 0.2);
  ctx.fillRect(cx - 7, obs.y + h * 0.17, 14, 4);

  // Red stripe
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(obs.x + 2, obs.y + h * 0.38, w - 4, 3);

  // Windshield
  ctx.fillStyle = "#88ccff";
  ctx.beginPath();
  ctx.moveTo(obs.x + 5, obs.y + h * 0.65);
  ctx.quadraticCurveTo(cx, obs.y + h * 0.82, obs.x + w - 5, obs.y + h * 0.65);
  ctx.lineTo(obs.x + w - 6, obs.y + h * 0.55);
  ctx.lineTo(obs.x + 6, obs.y + h * 0.55);
  ctx.closePath();
  ctx.fill();

  // Flashing lights on roof (alternate red/blue) — scaled to car size
  const sR = w * 0.1;
  const sOff = w * 0.16;
  const flash = Math.floor(Date.now() / 300) % 2;
  ctx.fillStyle = flash ? "red" : "blue";
  ctx.beginPath(); ctx.arc(obs.x + sOff, obs.y + h * 0.05, sR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? "blue" : "red";
  ctx.beginPath(); ctx.arc(obs.x + w - sOff, obs.y + h * 0.05, sR, 0, Math.PI * 2); ctx.fill();

  // Headlights
  const hlR = w * 0.1;
  ctx.fillStyle = "yellow";
  ctx.beginPath(); ctx.arc(obs.x + hlR, obs.y + h * 0.78, hlR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(obs.x + w - hlR, obs.y + h * 0.78, hlR, 0, Math.PI * 2); ctx.fill();
}

function drawPoliceObstacle(obs) {
