  ctx.fill();
  ctx.strokeStyle = (focusTarget === 1 || focusTarget === 2) ? "#f7c948" : "rgba(247,201,72,0.3)";
  ctx.lineWidth = (focusTarget === 1 || focusTarget === 2) ? 2 : 1;

  // Shop items highlight only when focused on shop items row
  const itemFocused = focusTarget === 2;
  ctx.beginPath();
  ctx.roundRect(20, shopY, canvas.width - 40, shopH, 10);
  ctx.stroke();

  // Shop title
  ctx.fillStyle = "#f7c948";
  ctx.font = "bold 16px 'Segoe UI', Arial";
  ctx.fillText("\u2B50 SHOP", canvas.width / 2, shopY + 20);

  // Category tabs
  const categories = ["color", "glow", "speed", "headlight"];
  const catLabels = ["CAR COLOUR", "GLOW EFFECT", "CAR SPEED", "HEADLIGHTS"];
  const tabW = 110;
  const tabStartX = canvas.width / 2 - (4 * tabW + 30) / 2;

  for (let i = 0; i < 4; i++) {
    const tx = tabStartX + i * (tabW + 10);
    const active = shopScroll === i;
    ctx.fillStyle = active ? "rgba(247,201,72,0.2)" : "rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.roundRect(tx, shopY + 30, tabW, 24, 5);
    ctx.fill();
    ctx.strokeStyle = (active && focusTarget === 1) ? "#f7c948" : active ? "rgba(247,201,72,0.5)" : "rgba(255,255,255,0.1)";
    ctx.lineWidth = (active && focusTarget === 1) ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(tx, shopY + 30, tabW, 24, 5);
    ctx.stroke();
    ctx.fillStyle = active ? "#f7c948" : "rgba(255,255,255,0.5)";
    ctx.font = "bold 11px 'Segoe UI', Arial";
    ctx.fillText(catLabels[i], tx + tabW / 2, shopY + 46);
  }

  // Category items
  const category = categories[shopScroll];
  const catItems = shopItems.filter(i => i.category === category);
  const selectedId = shopCursor;
  const itemW = 80, itemH = 65;
  const itemGap = 8;
  const totalItemW = catItems.length * itemW + (catItems.length - 1) * itemGap;
  const itemStartX = canvas.width / 2 - totalItemW / 2;
  const itemY = shopY + 62;

  for (let i = 0; i < catItems.length; i++) {
    const item = catItems[i];
    const ix = itemStartX + i * (itemW + itemGap);
    const isSelected = item.id === selectedId;

    // Item box
    ctx.fillStyle = isSelected ? "rgba(247,201,72,0.15)" : "rgba(255,255,255,0.04)";
    ctx.beginPath();
    ctx.roundRect(ix, itemY, itemW, itemH, 6);
    ctx.fill();
    let borderColor;
    if (isSelected && itemFocused) {
      borderColor = (!item.owned && tokens < item.cost) ? "rgba(150,150,150,0.6)" : "#f7c948";
    } else if (isSelected) {
      borderColor = "rgba(255,255,255,0.15)";
    } else if (item.owned) {
      borderColor = "rgba(255,255,255,0.1)";
    } else {
      borderColor = "rgba(255,100,100,0.3)";
    }
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = (isSelected && itemFocused) ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(ix, itemY, itemW, itemH, 6);
    ctx.stroke();

    // Color/glow preview
    if (category === "color") {
      ctx.fillStyle = item.value;
      ctx.beginPath();
      ctx.roundRect(ix + itemW / 2 - 10, itemY + 6, 20, 14, 3);
      ctx.fill();
    } else if (category === "glow") {
      if (item.value === "none") {
        ctx.strokeStyle = "#555";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ix + itemW / 2, itemY + 13, 7, 0, Math.PI * 2);
        ctx.stroke();
      } else if (item.value === "rainbow") {
        const rg = ctx.createLinearGradient(ix + itemW / 2 - 8, 0, ix + itemW / 2 + 8, 0);
        rg.addColorStop(0, "red"); rg.addColorStop(0.33, "yellow"); rg.addColorStop(0.66, "cyan"); rg.addColorStop(1, "magenta");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(ix + itemW / 2, itemY + 13, 7, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.shadowColor = item.value;
        ctx.shadowBlur = 10;
        ctx.fillStyle = item.value;
        ctx.beginPath();
        ctx.arc(ix + itemW / 2, itemY + 13, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    } else if (category === "headlight") {
      if (item.value === "rainbow") {
        const rg = ctx.createLinearGradient(ix + itemW / 2 - 8, 0, ix + itemW / 2 + 8, 0);
        rg.addColorStop(0, "red"); rg.addColorStop(0.33, "yellow"); rg.addColorStop(0.66, "cyan"); rg.addColorStop(1, "magenta");
        ctx.fillStyle = rg;
      } else {
        ctx.fillStyle = item.value;
      }
      ctx.shadowColor = item.value === "rainbow" ? "#fff" : item.value;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(ix + itemW / 2 - 6, itemY + 13, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ix + itemW / 2 + 6, itemY + 13, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px 'Segoe UI', Arial";
      ctx.fillText(item.value, ix + itemW / 2, itemY + 18);
    }

    // Label
    ctx.fillStyle = item.owned ? "#fff" : "#888";
    ctx.font = "11px 'Segoe UI', Arial";
    ctx.fillText(item.label, ix + itemW / 2, itemY + 36);

    // Status
    if (!item.owned) {
      ctx.fillStyle = tokens >= item.cost ? "#f7c948" : "#ff5555";
      ctx.font = "bold 10px 'Segoe UI', Arial";
      ctx.fillText("\u2B50 " + item.cost, ix + itemW / 2, itemY + 50);
      ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.font = "9px 'Segoe UI', Arial";
      ctx.fillText("B to buy", ix + itemW / 2, itemY + 60);
    } else if (isSelected) {
      ctx.fillStyle = "#44ff66";
      ctx.font = "bold 10px 'Segoe UI', Arial";
      ctx.fillText("\u2713 EQUIPPED", ix + itemW / 2, itemY + 52);
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.font = "10px 'Segoe UI', Arial";
      ctx.fillText("OWNED", ix + itemW / 2, itemY + 52);
    }
  }

  // Shop controls hint with drawn arrows
  function drawHintArrow(cx, cy, dir, sz) {
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath();
    if (dir === "up") {
      ctx.moveTo(cx, cy - sz); ctx.lineTo(cx + sz * 0.7, cy + sz * 0.5);
      ctx.lineTo(cx + sz * 0.2, cy + sz * 0.5); ctx.lineTo(cx + sz * 0.2, cy + sz);
      ctx.lineTo(cx - sz * 0.2, cy + sz); ctx.lineTo(cx - sz * 0.2, cy + sz * 0.5);
      ctx.lineTo(cx - sz * 0.7, cy + sz * 0.5);
    } else if (dir === "down") {
      ctx.moveTo(cx, cy + sz); ctx.lineTo(cx + sz * 0.7, cy - sz * 0.5);
      ctx.lineTo(cx + sz * 0.2, cy - sz * 0.5); ctx.lineTo(cx + sz * 0.2, cy - sz);
      ctx.lineTo(cx - sz * 0.2, cy - sz); ctx.lineTo(cx - sz * 0.2, cy - sz * 0.5);
      ctx.lineTo(cx - sz * 0.7, cy - sz * 0.5);
    } else if (dir === "left") {
      ctx.moveTo(cx - sz, cy); ctx.lineTo(cx + sz * 0.5, cy + sz * 0.7);
      ctx.lineTo(cx + sz * 0.5, cy + sz * 0.2); ctx.lineTo(cx + sz, cy + sz * 0.2);
      ctx.lineTo(cx + sz, cy - sz * 0.2); ctx.lineTo(cx + sz * 0.5, cy - sz * 0.2);
      ctx.lineTo(cx + sz * 0.5, cy - sz * 0.7);
    } else if (dir === "right") {
      ctx.moveTo(cx + sz, cy); ctx.lineTo(cx - sz * 0.5, cy + sz * 0.7);
      ctx.lineTo(cx - sz * 0.5, cy + sz * 0.2); ctx.lineTo(cx - sz, cy + sz * 0.2);
      ctx.lineTo(cx - sz, cy - sz * 0.2); ctx.lineTo(cx - sz * 0.5, cy - sz * 0.2);
      ctx.lineTo(cx - sz * 0.5, cy - sz * 0.7);
    }
    ctx.closePath();
    ctx.fill();
  }

  const hintY = shopY + shopH - 8;
  const lx = canvas.width / 2 - 240;
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.font = "11px 'Segoe UI', Arial";
  ctx.textAlign = "left";

  // Up/Down arrows
  drawHintArrow(lx + 18, hintY - 2, "up", 4);
  drawHintArrow(lx + 18, hintY + 8, "down", 4);
  ctx.fillText("= Switch row", lx + 28, hintY + 4);

  // Left/Right arrows
  drawHintArrow(lx + 115, hintY + 2, "left", 4);
  drawHintArrow(lx + 128, hintY + 2, "right", 4);
  ctx.fillText("= Select   |   B = Buy   |   Enter = Start", lx + 138, hintY + 4);

  // Controls hint
  // --- GARAGE SECTION ---
  const garageY = shopY + shopH + 14;
  const garageH = 139;

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.roundRect(20, garageY, canvas.width - 40, garageH, 10);
  ctx.fill();
  ctx.strokeStyle = (focusTarget === 3 || focusTarget === 4) ? "#f7c948" : "rgba(247,201,72,0.3)";
  ctx.lineWidth = (focusTarget === 3 || focusTarget === 4) ? 2 : 1;
  ctx.beginPath();
  ctx.roundRect(20, garageY, canvas.width - 40, garageH, 10);
  ctx.stroke();

  // Garage title
  ctx.fillStyle = "#f7c948";
  ctx.font = "bold 13px 'Segoe UI', Arial";
  ctx.textAlign = "center";
  ctx.fillText("GARAGE", canvas.width / 2, garageY + 14);

  // Garage category tabs
  const gCats = ["color", "glow", "speed", "headlight"];
  const gCatLabels = ["CAR COLOUR", "GLOW EFFECT", "CAR SPEED", "HEADLIGHTS"];
  const gTabW = 105;
  const gTabStartX = canvas.width / 2 - (4 * gTabW + 24) / 2;
  for (let gi = 0; gi < 4; gi++) {
    const gtx = gTabStartX + gi * (gTabW + 8);
    const active = garageScroll === gi;
    ctx.fillStyle = active ? "rgba(247,201,72,0.2)" : "rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.roundRect(gtx, garageY + 18, gTabW, 20, 4);
    ctx.fill();
    ctx.strokeStyle = (active && focusTarget === 3) ? "#f7c948" : active ? "rgba(247,201,72,0.4)" : "rgba(255,255,255,0.1)";
    ctx.lineWidth = (active && focusTarget === 3) ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(gtx, garageY + 18, gTabW, 20, 4);
    ctx.stroke();
    ctx.fillStyle = active ? "#f7c948" : "rgba(255,255,255,0.5)";
    ctx.font = "bold 9px 'Segoe UI', Arial";
    ctx.fillText(gCatLabels[gi], gtx + gTabW / 2, garageY + 32);
  }

  // Show owned items filtered by current garage category
  const ownedItems = shopItems.filter(i => i.owned && i.category === gCats[garageScroll]);
  const gItemW = 72, gItemH = 60;
  const gGap = 6;
  const gMaxItems = Math.floor((canvas.width - 80) / (gItemW + gGap));
  const gStartX = canvas.width / 2 - (Math.min(ownedItems.length, gMaxItems) * (gItemW + gGap) - gGap) / 2;

  for (let gi = 0; gi < Math.min(ownedItems.length, gMaxItems); gi++) {
    const item = ownedItems[gi];
    const gx = gStartX + gi * (gItemW + gGap);
    const isGSelected = item.id === garageCursor && focusTarget === 4;

    ctx.fillStyle = isGSelected ? "rgba(247,201,72,0.2)" : "rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.roundRect(gx, garageY + 44, gItemW, gItemH, 4);
    ctx.fill();
    ctx.strokeStyle = isGSelected ? "#f7c948" : "rgba(255,255,255,0.1)";
    ctx.lineWidth = isGSelected ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(gx, garageY + 44, gItemW, gItemH, 4);
    ctx.stroke();

    // Color preview
    if (item.category === "color") {
      ctx.fillStyle = item.value;
      ctx.fillRect(gx + gItemW/2 - 12, garageY + 50, 24, 12);
    } else if (item.category === "glow") {
      ctx.fillStyle = item.value === "rainbow" ? "#f7c948" : item.value;
      ctx.beginPath();
      ctx.arc(gx + gItemW/2, garageY + 58, 8, 0, Math.PI * 2);
      ctx.fill();
    } else if (item.category === "speed") {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px 'Segoe UI', Arial";
      ctx.textAlign = "center";
      ctx.fillText(item.value, gx + gItemW/2, garageY + 64);
    } else {
      ctx.fillStyle = item.value === "rainbow" ? "#f7c948" : item.value;
      ctx.beginPath();
      ctx.arc(gx + 14, garageY + 58, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(gx + gItemW - 14, garageY + 58, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Label
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "bold 10px 'Segoe UI', Arial";
    ctx.fillText(item.label, gx + gItemW/2, garageY + 94);
  }

  // Start new section for controls hints
  ctx.textAlign = "start";
  const hintBaseY = garageY + garageH + 24;
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.font = "13px 'Segoe UI', Arial";
  ctx.fillText("Arrow keys to drive  |  P = Pause  |  T = Resume  |  R = Reset", canvas.width / 2, hintBaseY);
  ctx.fillStyle = "#f7c948";
  ctx.font = "bold 15px 'Segoe UI', Arial";
  ctx.fillText("Press H for How to Play", canvas.width / 2, hintBaseY + 24);
  ctx.textAlign = "start";

  // Confirm buy overlay
  if (confirmBuy) {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const mw = 360, mh = 150;
    const mx = (canvas.width - mw) / 2, my = (canvas.height - mh) / 2;

    ctx.fillStyle = "rgba(20,25,50,0.97)";
    ctx.beginPath();
    ctx.roundRect(mx, my, mw, mh, 12);
    ctx.fill();
    ctx.strokeStyle = "#f7c948";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(mx, my, mw, mh, 12);
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("Buy \"" + confirmBuy.label + "\" for ⭐ " + confirmBuy.cost + "?", canvas.width / 2, my + 38);

    ctx.fillText("Are you sure you want to buy it?", canvas.width / 2, my + 68);

    // Yes/No buttons
    const by = my + 95;
    ctx.fillStyle = "#44cc66";
    ctx.beginPath();
    ctx.roundRect(mx + 60, by, 90, 32, 6);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 14px 'Segoe UI', Arial";
    ctx.fillText("YES (Y)", mx + 105, by + 22);

    ctx.fillStyle = "#ff5555";
    ctx.beginPath();
    ctx.roundRect(mx + 210, by, 90, 32, 6);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.fillText("NO (N)", mx + 255, by + 22);

    ctx.textAlign = "start";
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Title screen
  if (showingTitleScreen) {
    drawTitleScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Level select screen
  if (showingLevelSelect) {
    drawLevelSelect();
    if (showHelp) drawHelpScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Reset countdown
  if (resetting) {
    resetTimer--;
    if (resetTimer <= 0) {
      resetting = false;
      gameOver = false;
      gameOverTimer = 0;
      won = false;
      wonTimer = 0;
      paused = false;
      showingLevelSelect = true;
      obstacles.length = 0;
      explosionParticles.length = 0;
      damagePopups.length = 0;
      crashMessage = null;
    }
  }

  // Game over countdown and reset
  if (gameOver) {
    gameOverTimer--;
    if (gameOverTimer <= 0) {
      gameOver = false;
      showingLevelSelect = true;
      obstacles.length = 0;
      explosionParticles.length = 0;
      damagePopups.length = 0;
      crashMessage = null;
    }
  }

  // Win countdown and reset
  // Win waits for U key to replay

  // Game timer countdown
  if (!paused && !gameOver && !resetting && !won && !showHelp) {
    gameTimer--;
    if (gameTimer <= 0 && blood > 0) {
      won = true;
      wonTimer = 240; // 4 seconds
      const tokenRewards = [0, 2, 4, 5, 6, 8];
      tokens += tokenRewards[currentLevel];
    }
  }

  if (!paused && !gameOver && !won && !resetting && !showHelp) {
    update();
    updateExplosion();
    // Update damage popups
    for (let i = damagePopups.length - 1; i >= 0; i--) {
      damagePopups[i].y -= 1.5;
      damagePopups[i].life--;
      if (damagePopups[i].life <= 0) damagePopups.splice(i, 1);
    }
  }
  drawTrack();
  drawObstacles();
  drawCar();
  drawExplosion();

  // Draw border frame over everything to cover obstacles outside track
  const frameBg = ctx.createLinearGradient(0, 0, 0, canvas.height);
  frameBg.addColorStop(0, "#1a1a2e");
  frameBg.addColorStop(0.5, "#16213e");
  frameBg.addColorStop(1, "#0f3460");
  ctx.fillStyle = frameBg;
  ctx.fillRect(0, 0, canvas.width, track.y);                          // top

  // Top HUD - speed and controls
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.font = "12px 'Segoe UI', Arial";
  ctx.textAlign = "left";
  ctx.fillText("LV " + currentLevel + " - " + getLevelConfig().name, track.x, track.y - 12);
  ctx.textAlign = "center";
  ctx.fillText("P = Pause  |  T = Resume  |  R = Reset  |  \u2190\u2191\u2192\u2193 = Drive", canvas.width / 2, track.y - 12);
  ctx.textAlign = "start";

  // Token bar in top left
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();
  ctx.roundRect(track.x + 4, track.y + 8, 72, 28, 6);
  ctx.fill();
  ctx.strokeStyle = "rgba(247,201,72,0.4)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(track.x + 4, track.y + 8, 72, 28, 6);
  ctx.stroke();
  ctx.fillStyle = "#f7c948";
  ctx.font = "bold 15px 'Segoe UI', Arial";
  ctx.textAlign = "center";
  ctx.fillText("\u2B50 " + tokens, track.x + 40, track.y + 27);
  ctx.textAlign = "start";

  // Timer in top right corner
  const secs = Math.max(0, Math.ceil(gameTimer / 60));
  const mins = Math.floor(secs / 60);
  const secsDisplay = secs % 60;
  const timerStr = mins + ":" + (secsDisplay < 10 ? "0" : "") + secsDisplay;
  const timerColor = secs <= 10 ? "#ff3333" : secs <= 20 ? "#ffaa00" : "#ffffff";
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();
  ctx.roundRect(track.x + track.width - 70, track.y + 8, 62, 28, 6);
  ctx.fill();
  ctx.strokeStyle = secs <= 10 ? "rgba(255,50,50,0.5)" : "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(track.x + track.width - 70, track.y + 8, 62, 28, 6);
  ctx.stroke();
  ctx.fillStyle = timerColor;
  ctx.font = "bold 16px 'Segoe UI', Arial";
  ctx.textAlign = "center";
  ctx.fillText(timerStr, track.x + track.width - 39, track.y + 27);
  ctx.textAlign = "start";
  ctx.fillRect(0, track.y + track.height, canvas.width, canvas.height - track.y - track.height); // bottom
  ctx.fillRect(0, 0, track.x - 18, canvas.height);                    // left
  ctx.fillRect(track.x + track.width + 18, 0, canvas.width - track.x - track.width - 18, canvas.height); // right

  // Draw damage popups
  for (const dp of damagePopups) {
    ctx.globalAlpha = Math.min(1, dp.life / 20);
    ctx.shadowColor = "rgba(255,0,0,0.5)";
    ctx.shadowBlur = 6;
    ctx.fillStyle = "#ff3333";
    ctx.font = "bold 22px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText(dp.text, dp.x, dp.y);
    ctx.shadowBlur = 0;
    ctx.textAlign = "start";
  }
  ctx.globalAlpha = 1;

  // Draw blood indicator at bottom
  const barW = 260;
  const barH = 22;
  const barX = (canvas.width - barW) / 2;
  const barY = track.y + track.height + 18;

  // Bar shadow
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath();
  ctx.roundRect(barX - 1, barY + 1, barW + 2, barH + 2, 6);
  ctx.fill();

  // Background
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW, barH, 5);
  ctx.fill();

  // Blood bar with gradient
  const pct = blood / 100;
  if (pct > 0) {
    const hpGrad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
    if (pct > 0.5) {
      hpGrad.addColorStop(0, "#44ff44");
      hpGrad.addColorStop(1, "#00aa00");
    } else if (pct > 0.25) {
      hpGrad.addColorStop(0, "#ffcc00");
      hpGrad.addColorStop(1, "#cc8800");
    } else {
      hpGrad.addColorStop(0, "#ff4444");
      hpGrad.addColorStop(1, "#aa0000");
    }
    ctx.fillStyle = hpGrad;
    ctx.beginPath();
    ctx.roundRect(barX + 2, barY + 2, (barW - 4) * pct, barH - 4, 3);
    ctx.fill();

    // Shine highlight
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath();
    ctx.roundRect(barX + 2, barY + 2, (barW - 4) * pct, (barH - 4) / 2, 3);
    ctx.fill();
  }

  // Border
  ctx.strokeStyle = "#555";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW, barH, 5);
  ctx.stroke();

  // HP icon
  ctx.fillStyle = "#ff4444";
  ctx.font = "14px Arial";
  ctx.fillText("\u2764", barX - 20, barY + 16);

  // Text
  ctx.fillStyle = "white";
  ctx.font = "bold 13px 'Segoe UI', Arial";
  ctx.textAlign = "center";
  ctx.fillText(blood + "%", canvas.width / 2, barY + 16);
  ctx.textAlign = "start";

  // Draw obstacle counters panel
  const counterY = barY + 50;
  const colW = canvas.width / allTypes.length;
  const panelH = 58;

  // Panel background
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.roundRect(10, counterY - 22, canvas.width - 20, panelH, 8);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(10, counterY - 22, canvas.width - 20, panelH, 8);
  ctx.stroke();

  for (let i = 0; i < allTypes.length; i++) {
    const t = allTypes[i];
    const cx = i * colW + colW / 2;

    // Separator lines
    if (i > 0) {
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(i * colW, counterY - 18);
      ctx.lineTo(i * colW, counterY + panelH - 26);
      ctx.stroke();
    }

    // Draw mini icon
    ctx.save();
    ctx.translate(cx, counterY);
    ctx.scale(0.35, 0.35);
    const miniObs = { x: -15, y: -25, width: 30, height: 50, color: "#cc3333", type: t };
    if (t === "car") miniObs.color = "#cc3333";
    if (t === "truck") { miniObs.width = 34; miniObs.height = 90; miniObs.x = -17; miniObs.y = -45; miniObs.color = "#885500"; }
    if (t === "ambulance") { miniObs.height = 55; miniObs.y = -27; miniObs.color = "#ffffff"; }
    if (t === "police") miniObs.color = "#111111";
    if (t === "ufo") { miniObs.width = 40; miniObs.height = 40; miniObs.x = -20; miniObs.y = -20; miniObs.color = "#88ccff"; }
    if (t === "person") { miniObs.width = 24; miniObs.height = 40; miniObs.x = -12; miniObs.y = -20; miniObs.color = "#66ccff"; miniObs.skin = "#ffcc99"; miniObs.hair = "#553300"; miniObs.pants = "#333366"; miniObs.hat = "none"; miniObs.accessory = "none"; }
    if (t === "dog") { miniObs.width = 30; miniObs.height = 24; miniObs.x = -15; miniObs.y = -12; miniObs.color = "#8B4513"; }
    if (t === "kangaroo") { miniObs.width = 28; miniObs.height = 44; miniObs.x = -14; miniObs.y = -22; miniObs.color = "#8B6914"; }
    drawObstacleCar(miniObs);
    ctx.restore();

    // Numbers below icon
    ctx.fillStyle = "#8899aa";
    ctx.font = "10px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText(stats[t].appeared + " \u2022 " + stats[t].crashed, cx, counterY + 22);
  }
  ctx.textAlign = "start";

  // Reset screen
  if (resetting) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const pw = 300, ph = 120;
    const px = (canvas.width - pw) / 2, py = (canvas.height - ph) / 2;
    ctx.fillStyle = "rgba(10,20,40,0.95)";
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(100,180,255,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.stroke();

    ctx.shadowColor = "rgba(100,180,255,0.5)";
    ctx.shadowBlur = 15;
    ctx.fillStyle = "#f7c948";
    ctx.font = "bold 34px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("RESETTING", canvas.width / 2, py + 45);
    ctx.shadowBlur = 0;

    // Countdown number
    const secsLeft = Math.ceil(resetTimer / 60);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px 'Segoe UI', Arial";
    ctx.fillText(secsLeft, canvas.width / 2, py + 85);

    // Progress bar
    const pBarW = pw - 40;
    const pBarH = 6;
    const pBarX = px + 20;
    const pBarY = py + ph - 18;
    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.roundRect(pBarX, pBarY, pBarW, pBarH, 3);
    ctx.fill();
    ctx.fillStyle = "#f7c948";
    const prog = 1 - (resetTimer / 120);
    ctx.beginPath();
    ctx.roundRect(pBarX, pBarY, pBarW * prog, pBarH, 3);
    ctx.fill();

    ctx.textAlign = "start";
  }

  // Win overlay
  if (won) {
    ctx.fillStyle = "rgba(0,50,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const pw = 320, ph = 120;
    const px = (canvas.width - pw) / 2, py = (canvas.height - ph) / 2;
    ctx.fillStyle = "rgba(0,30,10,0.95)";
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(50,255,100,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.stroke();

    ctx.shadowColor = "rgba(50,255,100,0.6)";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#44ff66";
    ctx.font = "bold 42px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("YOU WON!", canvas.width / 2, py + 52);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "14px 'Segoe UI', Arial";
    const tokenRewards = [0, 2, 4, 5, 6, 8];
    ctx.fillText("HP remaining: " + blood + "%  |  \u2B50 +" + tokenRewards[currentLevel] + " Tokens!", canvas.width / 2, py + 80);
    ctx.fillText("Press U for level select", canvas.width / 2, py + 100);
    ctx.textAlign = "start";
  }

  // Game over overlay
  if (gameOver) {
    ctx.fillStyle = "rgba(80,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const pw = 300, ph = 100;
    const px = (canvas.width - pw) / 2, py = (canvas.height - ph) / 2;
    ctx.fillStyle = "rgba(30,0,0,0.9)";
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,50,50,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.stroke();

    ctx.shadowColor = "rgba(255,0,0,0.6)";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ff3333";
    ctx.font = "bold 40px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("YOU DIED", canvas.width / 2, py + 50);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "14px 'Segoe UI', Arial";
    ctx.fillText("Restarting...", canvas.width / 2, py + 78);
    ctx.textAlign = "start";
  }

  // Help screen
  if (showHelp) drawHelpScreen();

  // Draw pause overlay
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Pause box
    const pw = 280, ph = 100;
    const px = (canvas.width - pw) / 2, py = (canvas.height - ph) / 2;
    ctx.fillStyle = "rgba(20,20,40,0.9)";
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,200,50,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 12);
    ctx.stroke();

    ctx.fillStyle = "#f7c948";
    ctx.font = "bold 36px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", canvas.width / 2, py + 45);
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "14px 'Segoe UI', Arial";
    ctx.fillText("Press T to resume", canvas.width / 2, py + 75);
    ctx.textAlign = "start";
  }

  // Draw crash speech bubble
  if (crashMessage) {
    const msg = crashMessage.text;
    ctx.font = "bold 14px Arial";
    const textW = ctx.measureText(msg).width;
    const bx = crashMessage.x - textW / 2;
    const by = crashMessage.y - 30;

    // Speech bubble with shadow
    ctx.shadowColor = "rgba(0,0,0,0.3)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffffee";
    ctx.beginPath();
    ctx.roundRect(bx - 10, by - 20, textW + 20, 32, 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(bx - 10, by - 20, textW + 20, 32, 10);
    ctx.stroke();

    // Pointer triangle
    ctx.fillStyle = "#ffffffee";
    ctx.beginPath();
    ctx.moveTo(crashMessage.x - 6, by + 12);
    ctx.lineTo(crashMessage.x + 6, by + 12);
    ctx.lineTo(crashMessage.x, by + 22);
    ctx.closePath();
    ctx.fill();

    // Text
    ctx.fillStyle = "#222";
    ctx.fillText(msg, bx, by);
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

<!-- Auto-refresh: polls file for changes every second -->
<script>
(function() {
  let lastContent = null;
  setInterval(async () => {
    try {
      const res = await fetch(location.href, { cache: 'no-store' });
      const text = await res.text();
      if (lastContent === null) {
        lastContent = text;
      } else if (text !== lastContent) {
        location.reload();
      }
    } catch(e) {}
  }, 1000);
})();
</script>
